<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <title></title>
    <script src="addon.js"></script>
    <script src="jquery-3.3.1.js" type="text/javascript"></script>
    <script src="bootstrap.min.js"></script>
    <script src="jSignature.js"></script>
    <script src="jSignature.CompressorBase30.js"></script>
    <script src="jSignature.CompressorSVG.js"></script>
    <script src="jSignature.SignHere.js"></script>
    <script src="bootstrap.bundle.min.js"></script>
    <link href="bootstrap.min.css" rel="stylesheet">
    <link href="simple-sidebar.css" rel="stylesheet">
    <style>
      /* Global base styles */
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.5;
        color: #212529;
        background-color: #f8f9fa;
      }

      /* Card / Header styles */
      .card-header,
      .card-header.alert {
        background-color: #aed8f2;
        color: #1a252c;
        font-size: 16px;
        font-weight: 700;
        padding: 12px 16px;
        border-radius: 6px;
        margin-bottom: 20px;
        text-transform: uppercase;
      }

      /* Table Base Layout */
      #mainTable,
      #mainTable2 {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 12px;
        table-layout: fixed;
      }

      #mainTable td,
      #mainTable2 td {
        text-align: left;
        padding: 6px 12px;
        vertical-align: middle;
        word-break: break-word;
        overflow-wrap: break-word;
      }

      #mainTable td:first-child,
      #mainTable2 td:first-child {
        width: 30%;
        min-width: 150px;
        font-weight: 600;
        color: #333;
        vertical-align: middle;
      }

      #mainTable td:last-child,
      #mainTable2 td:last-child {
        width: 70%;
      }

      /* General Form Elements */
      :is(#mainTable, #mainTable2) td input:not([type="checkbox"]):not([type="radio"]),
      :is(#mainTable, #mainTable2) td select,
      :is(#mainTable, #mainTable2) td textarea {
        width: 100%;
        max-width: 450px;
        box-sizing: border-box;
        padding: 8px 12px;
        border: 1px solid #ced4da;
        border-radius: 6px;
        background-color: #fff;
        font-size: 14px;
      }

      :is(#mainTable, #mainTable2) td textarea {
        height: 90px;
        resize: vertical;
      }

      /* Checkboxes and Labels */
      :is(#mainTable, #mainTable2) td input[type="checkbox"],
      :is(#mainTable, #mainTable2) td input[type="radio"] {
        width: auto;
        padding: 0;
        margin: 0 8px 0 0;
        vertical-align: middle;
        cursor: pointer;
      }

      .checkbox-container {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }

      /* Signature Block Styling */
      #signatureparent {
        background-color: #c4c4c4;
        width: 100%;
        max-width: 450px;
        padding: 10px;
        box-sizing: border-box;
        border-radius: 6px;
        position: relative;
      }

      #signature {
        border: 2px dashed #666;
        background-color: #e2e2e2;
        width: 100%;
        height: 120px;
        box-sizing: border-box;
        touch-action: none;
        position: relative;
      }

      #tools {
        margin-top: 8px;
        width: 100%;
        max-width: 450px;
      }

      #tools input[type="button"] {
        width: 100%;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        border-radius: 6px;
        border: 1px solid #ced4da;
        background-color: #fff;
        transition: background-color 0.2s;
      }

      #tools input[type="button"]:hover {
        background-color: #e9ecef;
      }

      /* Action Buttons (Save/Back) */
      .form-actions {
        display: flex;
        gap: 12px;
        margin-top: 24px;
        padding-top: 16px;
      }

      .btn-blue {
        background-color: #007bff;
        color: white;
        padding: 10px 28px;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .btn-blue:hover {
        background-color: #0056b3;
      }

      /* Modal Styling */
      .modal {
        display: none;
        position: fixed;
        z-index: 1050;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        overflow-y: auto;
        padding: 16px;
      }

      .modal-content {
        background-color: #fff;
        margin: 5vh auto;
        padding: 20px;
        width: 100%;
        max-width: 650px;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        /* Faint track */
        border-top: 2px solid #ffffff;
        /* Bright moving part */
        border-radius: 50%;
        /* Essential properties for animation */
        display: inline-block;
        animation: rotator 0.8s linear infinite;
        /* Alignment */
        vertical-align: middle;
        margin-right: 10px;
      }

      @keyframes rotator {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }

      .box {
        display: none;
      }

      #cover-spin {
        position: fixed;
        width: 100%;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        background-color: rgba(255, 255, 255, 0.7);
        z-index: 9999;
        display: block;
      }

      @-webkit-keyframes spin {
        from {
          -webkit-transform: rotate(0deg);
        }

        to {
          -webkit-transform: rotate(360deg);
        }
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }
      }

      #cover-spin::after {
        content: '';
        display: block;
        position: absolute;
        left: 44vw;
        top: 40%;
        width: 12vw;
        height: 12vw;
        border-style: solid;
        border-color: black;
        border-top-color: transparent;
        border-width: 4px;
        border-radius: 50%;
        -webkit-animation: spin .8s linear infinite;
        animation: spin .8s linear infinite;
      }

      /* Responsive Styles */
      @media (max-width: 768px) {
        .hidden-row {
          display: none !important;
        }

        #mainTable,
        #mainTable2,
        #mainTable tbody,
        #mainTable2 tbody,
        #mainTable tr,
        #mainTable2 tr,
        #mainTable td,
        #mainTable2 td {
          display: block;
          width: 100% !important;
          max-width: 100% !important;
        }

        #mainTable tr,
        #mainTable2 tr {
          margin-bottom: 12px;
        }

        #mainTable td:first-child,
        #mainTable2 td:first-child {
          padding-bottom: 4px;
        }

        :is(#mainTable, #mainTable2) td input:not([type="checkbox"]):not([type="radio"]),
        :is(#mainTable, #mainTable2) td select,
        :is(#mainTable, #mainTable2) td textarea,
        #signatureparent,
        #tools {
          max-width: 100%;
        }
      }

      /* Backdrop Overlay */
      .modal {
        display: none;
        position: fixed;
        z-index: 1050;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(15, 23, 42, 0.5);
        /* Deep slate overlay */
        backdrop-filter: blur(4px);
        overflow-y: auto;
        padding: 20px;
      }

      /* Modal Card Box */
      .modal-content {
        background-color: #ffffff;
        margin: 6vh auto;
        padding: 32px;
        width: 100%;
        max-width: 680px;
        border-radius: 12px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        position: relative;
      }

      /* Step Wizard Row (Positioned below top-left close button) */
      .step-wizard {
        display: flex;
        overflow-x: auto;
        overflow-y: hidden;
        white-space: nowrap;
        gap: 8px;
        margin-top: 24px;
        margin-bottom: 20px;
        padding-bottom: 8px;
        pointer-events: auto !important;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-x;
        /* Smooth scrolling animation when updated via JS */
        scroll-behavior: smooth;
      }

      /* Optional: Clean scrollbar styling for Chrome / WebKit */
      .step-wizard::-webkit-scrollbar {
        height: 4px;
      }

      .step-wizard::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }

      .step-item {
        flex: 0 0 auto;
        /* Keeps pill dimensions fixed without squishing */
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 600;
        border-radius: 20px;
        background-color: #f1f5f9;
        color: #64748b;
        user-select: none;
        /* Prevents awkward text highlight during swipe */
      }

      .step-item.active {
        background-color: #27272a;
        color: #ffffff;
      }

      /* Active Step Badge */
      .step-item.active {
        background-color: #27272a;
        /* Dark sleek active pill */
        color: #ffffff;
      }

      /* Step Title Header */
      .modal-content h3,
      .modal-step h3 {
        font-size: 20px;
        font-weight: 700;
        color: #0f172a;
        margin-top: 0;
        margin-bottom: 16px;
      }

      /* Full-Width Textarea Form Area */
      .modal-step textarea,
      .modal-content textarea {
        width: 100%;
        height: 180px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 14px 16px;
        font-size: 15px;
        color: #1e293b;
        background-color: #ffffff;
        resize: vertical;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      .modal-step textarea::placeholder,
      .modal-content textarea::placeholder {
        color: #94a3b8;
      }

      .modal-step textarea:focus,
      .modal-content textarea:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }

      /* Modal Footer & Action Buttons */
      .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid #f1f5f9;
      }

      /* Button Base Styles */
      .btn-nav {
        padding: 10px 24px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        border: none;
        transition: background-color 0.2s, transform 0.1s;
      }

      /* Previous Button (Lime/Yellow Accent) */
      #prevBtn {
        background-color: #d9f99d;
        /* Softer, modern lime */
        color: #1a2e05;
      }

      #prevBtn:hover {
        background-color: #bef264;
      }

      #prevBtn:active {
        transform: scale(0.98);
      }

      /* Next Button (Vibrant Green) */
      #nextBtn {
        background-color: #22c55e;
        /* Crisp modern green */
        color: #ffffff;
      }

      #nextBtn:not(:disabled):hover {
        background-color: #16a34a;
      }

      #nextBtn:not(:disabled):active {
        transform: scale(0.98);
      }

      #nextBtn:disabled {
        background-color: #e2e8f0;
        color: #94a3b8;
        cursor: not-allowed;
      }

      /* Mobile Responsive Overrides */
      @media (max-width: 600px) {
        .modal {
          padding: 8px;
          /* Reduce outer overlay gap */
        }

        .modal-content {
          margin: 10px auto;
          padding: 20px 16px 16px 16px;
          border-radius: 12px;
        }

        .close-btn {
          top: 16px;
          left: 16px;
        }

        /* Horizontal scrolling step wizard with fixed-size pills */
        .step-wizard {
          display: flex;
          overflow-x: auto;
          /* Enables horizontal scroll */
          flex-wrap: nowrap;
          gap: 8px;
          margin-top: 24px;
          margin-bottom: 20px;
          padding-bottom: 6px;
          /* Room for scrollbar */
          -webkit-overflow-scrolling: touch;
          /* Smooth iOS scrolling */
        }

        .step-item {
          flex: 0 0 auto;
          /* Prevents pills from shrinking */
          padding: 8px 14px;
          font-size: 12px;
          white-space: nowrap;
          /* Keeps step text on a single line */
          border-radius: 20px;
        }

        /* Form Fields */
        .modal-content h3,
        .modal-step h3 {
          font-size: 16px;
          margin-bottom: 12px;
        }

        .modal-step textarea,
        .modal-content textarea {
          height: 140px;
          font-size: 14px;
          padding: 12px;
        }

        /* Full-width sticky-style footer buttons for mobile */
        .modal-footer {
          display: flex;
          gap: 8px;
          margin-top: 16px;
          padding-top: 12px;
        }

        .btn-nav {
          flex: 1;
          /* Stretch buttons evenly side-by-side */
          text-align: center;
          padding: 12px 8px;
          font-size: 14px;
        }
      }

      #signature canvas.jSignature {
        height: 118px !important;
      }
    </style>
    <style>
      /*This is the div within which the signature canvas is fitted*/
      #signature {
        border: 2px dotted black;
        background-color: lightgrey;
      }

      .custom-select {
        width: 100%;
      }

      #datetime {
        width: 180px;
      }

      @media (max-width: 500px) {
        .custom-select {
          width: 50%;
        }

        #asset_tag,
        #act_taken,
        #act_taken2,
        #datetime,
        #next_action,
        #next_action2 {
          width: 50%;
        }

        #serialnumberupdate {
          width: 70%;
        }
      }

      .hidden-row {
        display: none;
      }
    </style>
  </head>
  <body></body>
</html>
